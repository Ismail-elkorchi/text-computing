name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency Review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}"
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT

          for attempt in 1 2 3 4 5; do
            http_status="$(
              curl --silent --show-error \
                --output "${response_file}" \
                --write-out "%{http_code}" \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${url}" || true
            )"
            if [ "${http_status}" = "200" ]; then
              cp "${response_file}" dependency-review.json
              break
            fi
            if [ "${attempt}" = "5" ]; then
              printf 'dependency review API failed after %s attempts (HTTP %s)\n' "${attempt}" "${http_status}" >&2
              head -c 1000 "${response_file}" >&2 || true
              exit 1
            fi
            sleep $((attempt * 5))
          done

          python3 <<'PY'
          import json
          import sys

          with open("dependency-review.json", encoding="utf-8") as handle:
              changes = json.load(handle)

          if not isinstance(changes, list):
              raise SystemExit("dependency review response must be a list")

          blocked = {"moderate", "high", "critical"}
          failures = []
          for change in changes:
              for vulnerability in change.get("vulnerabilities") or []:
                  severity = str(vulnerability.get("severity", "")).lower()
                  if severity in blocked:
                      failures.append(
                          {
                              "package": change.get("name"),
                              "version": change.get("version"),
                              "severity": severity,
                              "advisory": vulnerability.get("advisory_ghsa_id")
                              or vulnerability.get("ghsa_id")
                              or vulnerability.get("id"),
                          }
                      )

          print(f"dependency review changes={len(changes)} blocked_vulnerabilities={len(failures)}")
          if failures:
              print(json.dumps(failures, indent=2, sort_keys=True))
              sys.exit(1)
          PY
