name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Schema Validate
        run: npm run schema:validate

      - name: Module and composition regression tests
        run: npm test

      - name: Static API checks
        run: npm run check:static

      - name: Isolated package and import cost checks
        run: npm run check:pack

      - name: Browser and Worker module smoke tests
        run: npm -w @ismail-elkorchi/text-computing run test:browser:run && npm -w @ismail-elkorchi/text-computing run test:workers:run

      - name: Forge regression tests
        run: npm run forge:verify && npm run test:forge

      - name: Held-out NLP benchmarks
        run: npm run test:nlp
